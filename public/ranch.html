<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>Ranch tools</title>
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ranch.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="top">
    <a class="home" href="/">Predator Watch</a>
    <span class="place">Ranch tools</span>
    <nav id="nav" aria-label="Ranch tools" hidden>
      <a href="#activity" data-screen="activity">Activity log</a>
      <a href="#settings" data-screen="settings">Settings</a>
      <a href="#outbox" data-screen="outbox">Outbox</a>
      <a href="#by-hand" data-screen="by-hand">By hand</a>
      <button type="button" class="quiet" id="signout">Sign out</button>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p>Ranch tools need JavaScript.</p></noscript>
  </main>
  <footer class="foot">
    <p id="who" class="hint"></p>
  </footer>
  <script type="module" src="/ranch.js"></script>
</body>
</html>
